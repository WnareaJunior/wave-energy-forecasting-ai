[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line length is handled by the formatter
    "B008",  # function call in default argument
]

[tool.ruff.lint.per-file-ignores]
"src/infrastructure/*.py" = ["E402"]  # sys.path bootstrap before src imports
