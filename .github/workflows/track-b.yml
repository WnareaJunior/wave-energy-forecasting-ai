name: Track B postprocessing

# Builds the paired GEFS-forecast / NDBC-observation dataset and asks whether a
# statistical model can improve on the raw physics forecast.
#
# Each GEFS cycle is an 8.7 MB download and files are deleted as they are
# consumed, so peak disk stays small regardless of how many cycles are read.
# Stride controls the trade between transfer volume and sample count: stride 1
# over 2015-2019 is ~1,800 cycles and ~16 GB.

on:
  workflow_dispatch:
    inputs:
      stations:
        description: "Comma-separated NDBC stations"
        required: true
        default: "46041"
        type: string
      years:
        description: "Year range; the reforecast ends in 2019"
        required: true
        default: "2015-2019"
        type: string
      stride:
        description: "Take every Nth daily cycle (1 = all, ~16 GB)"
        required: true
        default: "3"
        type: string
      horizons:
        description: "Comma-separated lead times in hours"
        required: false
        default: "6,12,24,48,72"
        type: string

  push:
    branches:
      - claude/forecasting-model-architecture-s5180n
    paths:
      - "src/data/gefs.py"
      - "experiments/track_b_postprocess.py"
      - ".github/workflows/track-b.yml"

permissions:
  contents: read

env:
  STATIONS: ${{ inputs.stations || '46041' }}
  YEARS: ${{ inputs.years || '2015-2019' }}
  STRIDE: ${{ inputs.stride || '3' }}
  HORIZONS: ${{ inputs.horizons || '6,12,24,48,72' }}

jobs:
  track-b:
    name: Postprocess
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pilot.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pilot.txt
          pip install boto3 xarray netCDF4

      - name: Check data sources are reachable
        run: |
          python - <<'PY'
          import sys
          import boto3, requests
          from botocore import UNSIGNED
          from botocore.config import Config

          try:
              r = requests.get(
                  "https://www.ndbc.noaa.gov/data/historical/stdmet/46041h2016.txt.gz",
                  timeout=30, stream=True,
              )
              r.close()
              assert r.ok, f"HTTP {r.status_code}"
          except Exception as e:
              sys.exit(f"cannot reach ndbc.noaa.gov: {e}")

          s3 = boto3.client("s3", config=Config(signature_version=UNSIGNED))
          try:
              s3.head_object(
                  Bucket="noaa-nws-gefswaves-reforecast-pds",
                  Key="GEFSv12/reforecast/2016/20160104/station/"
                      "gefs.wave.20160104.c00.tab.nc",
              )
          except Exception as e:
              sys.exit(f"cannot reach the GEFS bucket: {e}")
          print("both sources reachable")
          PY

      - name: Run Track B
        run: |
          set -o pipefail
          echo "Stations: $STATIONS  Years: $YEARS  Stride: $STRIDE  Horizons: $HORIZONS"
          python experiments/track_b_postprocess.py \
            --stations "$STATIONS" \
            --years "$YEARS" \
            --stride "$STRIDE" \
            --horizons "$HORIZONS" 2>&1 | tee track_b.log

      - name: Publish to the run summary
        if: always()
        run: |
          {
            echo "# Track B: $STATIONS, $YEARS (stride $STRIDE)"
            echo
            echo '```'
            tail -c 60000 track_b.log 2>/dev/null || echo "no output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track-b-run${{ github.run_number }}
          path: |
            results/
            track_b.log
          if-no-files-found: warn
          retention-days: 30
