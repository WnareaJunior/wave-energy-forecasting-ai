name: CI

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    # Two dependency sets, because they resolve to genuinely different
    # libraries and the difference has already bitten.
    #
    #   pinned - requirements.txt, currently pandas 2.3 / numpy 2.3
    #   loose  - requirements-pilot.txt, which resolves to the newest release,
    #            currently pandas 3.0 / numpy 2.4
    #
    # pandas 3 enables copy-on-write, so `.to_numpy()` returns a read-only
    # array. Code that mutated one in place passed every local test on the
    # pinned set and crashed in CI on the loose set. Testing only the pinned
    # versions means testing something nobody actually runs.
    name: Lint and test (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dependencies: [pinned, loose]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-pilot.txt

      - name: Install dependencies (pinned)
        if: matrix.dependencies == 'pinned'
        # Installing the full pinned set is deliberate: it is what catches an
        # unparseable or unresolvable requirements.txt before it reaches a
        # deployment target.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install dependencies (loose)
        if: matrix.dependencies == 'loose'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pilot.txt
          pip install pytest pytest-cov ruff xarray netCDF4 matplotlib nbformat

      - name: Show resolved versions
        run: pip list | grep -Ei "^(numpy|pandas|scikit-learn|xarray|lightgbm) "

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest --cov=src --cov-report=term-missing

  encoding:
    name: Requirements files are UTF-8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # requirements.txt was previously committed as UTF-16-LE with a BOM by a
      # PowerShell `pip freeze >` redirect, which pip cannot parse on Linux.
      - name: Check encoding
        run: |
          for f in requirements*.txt; do
            python -c "open('$f', encoding='utf-8').read()" \
              || { echo "::error file=$f::not valid UTF-8"; exit 1; }
            head -c 3 "$f" | grep -q $'\xef\xbb\xbf' \
              && { echo "::error file=$f::has a UTF-8 BOM"; exit 1; }
            echo "$f OK"
          done
