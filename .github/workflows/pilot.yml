name: Buoy pilot

# Manual only. Run from the Actions tab: pick a station and year range, press
# "Run workflow". GitHub's runners have unrestricted outbound network access, so
# this fetches real NDBC data and runs the full model ladder without needing any
# machine of your own - which also means it works from a phone.
#
# Results appear three ways:
#   * the four tables rendered in the run summary (no download needed)
#   * the raw log in the step output
#   * a downloadable artifact with the results CSV

on:
  workflow_dispatch:
    inputs:
      station:
        description: "Comma-separated NDBC stations (46041 Cape Elizabeth, 46087 Neah Bay, 46029 Columbia River)"
        required: true
        default: "46041,46087,46029"
        type: string
      years:
        description: "Inclusive year range, e.g. 2015-2023"
        required: true
        default: "2015-2023"
        type: string
      horizons:
        description: "Comma-separated lead times in hours"
        required: false
        default: "1,3,6,12,24,48,72"
        type: string

  # workflow_dispatch only appears in the Actions tab once this file is on the
  # default branch. Until this branch merges, a scoped push trigger runs the
  # pilot on the default station so results are available immediately. Narrow or
  # drop this block after merging - the manual trigger is the intended interface.
  push:
    branches:
      - claude/forecasting-model-architecture-s5180n
    paths:
      - "src/**"
      - "experiments/**"
      - "requirements-pilot.txt"
      - ".github/workflows/pilot.yml"

permissions:
  contents: read

# The `inputs` context is only populated for workflow_dispatch. On a push it is
# empty, so every use needs a fallback or the job runs with blank arguments.
env:
  STATION: ${{ inputs.station || '46041,46087,46029' }}
  YEARS: ${{ inputs.years || '2015-2023' }}
  HORIZONS: ${{ inputs.horizons || '1,3,6,12,24,48,72' }}

jobs:
  pilot:
    name: Run pilot
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pilot.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pilot.txt

      - name: Check NDBC is reachable
        run: |
          python - <<'PY'
          import sys
          import requests

          url = "https://www.ndbc.noaa.gov/data/historical/stdmet/46041h2020.txt.gz"
          try:
              r = requests.get(url, timeout=30, stream=True)
              r.close()
          except Exception as e:
              sys.exit(f"cannot reach ndbc.noaa.gov: {e}")
          if not r.ok:
              sys.exit(f"ndbc.noaa.gov returned HTTP {r.status_code}")
          print("reachable")
          PY

      # Inputs are passed as environment variables rather than interpolated into
      # the script body, so no input value can be executed as shell.
      - name: Run pilot
        run: |
          set -o pipefail
          echo "Stations: $STATION   Years: $YEARS   Horizons: $HORIZONS"
          python experiments/pilot_ndbc.py \
            --stations "$STATION" \
            --years "$YEARS" \
            --horizons "$HORIZONS" 2>&1 | tee pilot.log

      - name: Publish results to the run summary
        if: always()
        run: |
          {
            echo "# Buoy pilot: NDBC $STATION, $YEARS (rolling-origin)"
            echo
            echo '```'
            cat pilot.log 2>/dev/null || echo "no output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Fixed name: the station list is comma-separated and would make an
          # awkward (and possibly invalid) artifact name.
          name: pilot-results-run${{ github.run_number }}
          path: |
            results/
            pilot.log
          if-no-files-found: warn
          retention-days: 30
